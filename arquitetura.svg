<line x1="600" y1="185" x2="600" y2="245" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<rect x="390" y="245" width="420" height="100" rx="18" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
<text x="600" y="285" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Backend / API</text>
