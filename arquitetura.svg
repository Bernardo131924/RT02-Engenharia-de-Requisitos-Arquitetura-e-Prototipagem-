<line x1="710" y1="345" x2="900" y2="455" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<rect x="100" y="455" width="400" height="100" rx="18" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
<text x="300" y="495" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Banco de Dados</text>
