<line x1="900" y1="620" x2="600" y2="620" stroke="#334155" stroke-width="4"/>
<line x1="600" y1="620" x2="600" y2="345" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<text x="600" y="665" text-anchor="middle" font-family="Arial" font-size="18">Resultado da IA retorna ao Backend e é apresentado no Frontend</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
